name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "demo/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "demo/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Project tests and integration smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci_password_placeholder
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5433"
      POSTGRES_DB: it_jobs_dw
      MINIO_ROOT_USER: ci_minio_user
      MINIO_ROOT_PASSWORD: ci_minio_password_placeholder
      AWS_ACCESS_KEY_ID: ci_minio_user
      AWS_SECRET_ACCESS_KEY: ci_minio_password_placeholder
      AIRFLOW_FERNET_KEY: ""
      AIRFLOW_ADMIN_USER: admin
      AIRFLOW_ADMIN_PASSWORD: ci_airflow_password_placeholder
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CHAT_ID: ""

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 
        with:
          python-version: "3.11.16"

      - name: Set up pinned Docker Engine
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 
        with:
          version: v29.7.2

      - name: Install pinned Docker Compose
        shell: bash
        run: |
          set -euo pipefail
          compose_path="$(mktemp)"
          curl --fail --silent --show-error --location \
            "https://github.com/docker/compose/releases/download/v5.4.0/docker-compose-linux-x86_64" \
            --output "$compose_path"
          echo "837fd1d35bf6a494f41b5b5988269a7be79de337cf1a1a6ff0e45ab51bb4e9be  $compose_path" \
            | sha256sum --check --strict
          sudo install -m 0755 "$compose_path" /usr/local/bin/docker-compose
          sudo install -d /usr/local/lib/docker/cli-plugins
          sudo install -m 0755 "$compose_path" /usr/local/lib/docker/cli-plugins/docker-compose
          docker version
          docker compose version

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.12.5"

      - name: Scan publishable files for secrets
        run: python scripts/check_secrets.py

      - name: Install locked dependencies
        run: uv sync --frozen --group dev

      - name: Ruff
        run: uv run ruff check .

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Start initialized PostgreSQL
        run: docker compose up -d --wait postgres

      - name: Run dbt against PostgreSQL
        run: |
          uv run dbt seed --project-dir transform_dbt --profiles-dir transform_dbt
          uv run dbt run --project-dir transform_dbt --profiles-dir transform_dbt
          uv run dbt test --project-dir transform_dbt --profiles-dir transform_dbt

      - name: Build and smoke-test dashboard
        run: |
          docker compose up -d --build --wait dashboard
          docker compose exec -T dashboard python dashboard/smoke_test.py

      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color postgres dashboard

      - name: Stop integration services
        if: always()
        run: docker compose down --volumes