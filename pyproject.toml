[project]
name = "it-job-elt-pipeline"
version = "0.1.0"
description = "Add the libraries required for this project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=50.0.0",
    "dbt-core>=1.12.0",
    "dbt-postgres>=1.11.0",
    "deltalake>=1.6.2",
    "google-auth>=2.56.2",
    "google-cloud-storage>=3.13.0",
    "loguru>=0.7.3",
    "pandas>=3.0.5",
    "pendulum>=3.2.0",
    "playwright>=1.62.0",
    "psycopg2-binary>=2.9.12",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.1",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]

[tool.ruff]
extend-exclude = [
    "crawl/",
]
